<!DOCTYPE html>
<html>
    <head>
    <title>PeeP</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <h1>peep</h1>
    <p>One Identity. Everything you are. </p>

<div class="container">
    <div class="search-box">
        <input type="text" id="searchInput" placeholder=" Search any name or @handle...">
        <button onclick="search()" >Search</button>
    </div>

<div class="register-box">
    <h2>join peep</h2>
    <input type="text" id="regName" placeholder="Your full name">
    <input type="text" id="regHandle" placeholder="@yourhandle">
    <input type="text" id="regLocation" placeholder="Your city">
    <input type="text" id="regPlatforms"placeholder="Instagram, Tiktok, X...">
    <button onclick="register()">join peep</button>
</div>

</div>

<div class="phone-screen">
    <div class="phone-header">
        <div class="phone-avatar">A</div>
        <div class="phone-info">
            <h3>@ahmad</h3>
            <p id="phone-location">London</p>
            <span class="phone-verified">✓ Verified</span>

        </div>
    </div>


    <div class="apps-grid">
        <div class="app-icon" style="background: linear-gradient(135deg, #f09433, #dc2743)">
            <i class="fab fa-instagram"></i>
            <span>Instagram</span>
         </div>
    <div class="app-icon" style="background: #1877f2">
        <i class="fab fa-facebook"></i>
        <span>Facebook</span>
    </div>
    <div class="app-icon" style="background: #111">
        <i class="fab fa-tiktok"></i>
        <span>TikTok</span>
    </div>
    <div class="app-icon" style="background: #111">
        <i class="fab fa-x-twitter"></i>
        <span>X</span>
    </div>
    <div class="app-icon" style="background: #25d366">
        <i class="fab fa-whatsapp"></i>
        <span>WhatsApp</span>
    </div>
    <div class="app-icon" style="background: #ff0000">
        <i class="fab fa-youtube"></i>
        <span>YouTube</span>
    </div>
    <div class="app-icon" style="background: #0077b5">
        <i class="fab fa-linkedin"></i>
        <span>LinkedIn</span>
    </div>
    <div class="app-icon" style="background: #ff9900">
        <i class="fab fa-amazon"></i>
        <span>Amazon</span>
    </div>
</div>
</div>
 
<div id="result"></div>
<script src="script.js"></script>
</body>
</html>
